services:
  # ─── Infrastructure ───────────────────────────────────────────────────────────

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
    ports:
      - "9200:9200"
    networks:
      - siem-network
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - siem-network
    volumes:
      - kibana_data:/usr/share/kibana/data

  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    ports:
      - "5044:5044"
      - "5000:5000/udp"
      - "5001:5001/tcp"
      - "9600:9600"
    environment:
      - LS_JAVA_OPTS=-Xms512m -Xmx512m

    volumes:
      - ./configs/logstash/pipeline.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - ./configs/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - siem-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - siem-network
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-siemsoar2024}
      - POSTGRES_DB=siemsoar
    ports:
      - "5432:5432"
    networks:
      - siem-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    networks:
      - siem-network
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - siem-network
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro

  # ─── Application ──────────────────────────────────────────────────────────────

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - DB_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-siemsoar2024}@postgres:5432/siemsoar
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - ES_URL=http://elasticsearch:9200
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SECRET_KEY=${JWT_SECRET:-dev-secret-change-me}
      - DEBUG=false
      - AI_ENGINE_URL=http://ai-engine:8001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    networks:
      - siem-network
    restart: unless-stopped

  ai-engine:
    build:
      context: ./ai-engine
    ports:
      - "8001:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - ES_URL=http://elasticsearch:9200
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY:-}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY:-}
    depends_on:
      - redis
    networks:
      - siem-network
    restart: unless-stopped

  collector:
    build:
      context: ./collectors
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LOGSTASH_HOST=logstash
      - LOGSTASH_PORT=5044
      - LOG_WATCH_DIR=/logs
    volumes:
      - F:\logs:/logs:ro
    depends_on:
      - redis
    networks:
      - siem-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - siem-network
    restart: unless-stopped

  flower:
    image: mher/flower:latest
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - siem-network

networks:
  siem-network:
    driver: bridge

volumes:
  es_data:
  kibana_data:
  redis_data:
  postgres_data:
  grafana_data:
  prometheus_data:

